services:
  - type: web
    name: python-rag-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: API_V1_STR
        value: /api
      - key: DATABASE_URL
        value: sqlite:///./python_rag.db
